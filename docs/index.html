<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#183d2b">
<title>Mow</title>

<style>
* { box-sizing: border-box; }

:root {
  --bg: #183d2b;
  --card: #ffffff;
  --text: #142019;
  --muted: #6f7872;
  --yellow: #f4d447;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
}

.app {
  max-width: 430px;
  margin: auto;
  min-height: 100vh;
  padding: 22px 16px 45px;
}

.brand {
  color: white;
  font-size: 24px;
  font-weight: 850;
  margin: 3px 4px 18px;
}

.card {
  background: var(--card);
  border-radius: 26px;
  padding: 22px;
  margin-bottom: 15px;
  box-shadow: 0 10px 30px rgba(0,0,0,.13);
}

.eyebrow {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .13em;
  color: var(--muted);
  text-transform: uppercase;
}

/* TODAY */

.hero {
  text-align: center;
  padding: 27px 20px 29px;
}

.score {
  font-size: 96px;
  line-height: 1;
  font-weight: 850;
  letter-spacing: -6px;
  margin: 12px 0 10px;
  transition: color .25s ease, transform .2s ease;
}

.best-window {
  font-size: 19px;
  font-weight: 700;
}

/* WEEK */

.week-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
  margin-top: 16px;
}

.day {
  border: 0;
  background: transparent;
  padding: 5px 0;
  cursor: pointer;
}

.day-name {
  font-size: 11px;
  font-weight: 800;
  color: #777;
  margin-bottom: 7px;
}

.day-score {
  width: 52px;
  height: 52px;
  margin: auto;
  border-radius: 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: 850;
  font-size: 17px;
  transition: transform .15s ease;
}

.day.selected .day-score {
  outline: 3px solid #17231c;
  outline-offset: 2px;
  transform: scale(1.05);
}

/* LAWN */

.last-mowed {
  font-size: 18px;
  font-weight: 700;
  margin-top: 10px;
}

.lawn-meter {
  display: flex;
  gap: 7px;
  margin-top: 19px;
}

.blade {
  flex: 1;
  height: 11px;
  background: #e2e6e2;
  border-radius: 10px;
  transition: background .45s ease, transform .45s ease;
}

.blade.active {
  background: #449b55;
}

.lawn-status {
  margin-top: 10px;
  font-size: 19px;
  font-weight: 800;
}

/* BUTTON */

.mow-button {
  position: relative;
  width: 100%;
  border: 0;
  border-radius: 18px;
  padding: 17px;
  margin-top: 22px;
  background: var(--yellow);
  color: #172018;
  font-size: 17px;
  font-weight: 850;
  cursor: pointer;
  overflow: visible;
  transition: transform .12s ease, opacity .2s ease;
}

.mow-button:active:not(:disabled) {
  transform: scale(.97);
}

.mow-button:disabled {
  opacity: .58;
  cursor: default;
  transform: none;
}

.undo {
  display: none;
  width: 100%;
  text-align: center;
  margin-top: 13px;
  border: 0;
  background: none;
  font-size: 14px;
  font-weight: 700;
  color: #56625a;
  cursor: pointer;
}

/* GRASS CONFETTI */

.confetti {
  position: fixed;
  width: 5px;
  height: 20px;
  border-radius: 100% 0 100% 0;
  background: #4c9e4f;
  pointer-events: none;
  z-index: 100;
  animation: grassPop 950ms ease-out forwards;
}

@keyframes grassPop {
  0% {
    transform: translate(0,0) rotate(0deg) scale(.5);
    opacity: 1;
  }

  100% {
    transform:
      translate(var(--x), var(--y))
      rotate(var(--r))
      scale(1);
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .confetti { display: none; }
}
</style>
</head>

<body>

<main class="app">

  <div class="brand">Mow</div>

  <section class="card hero">

    <div class="eyebrow" id="heroDay">
      Today
    </div>

    <div class="score" id="mainScore">
      6.4
    </div>

    <div class="best-window" id="bestWindow">
      Best conditions 5–7:30 PM
    </div>

  </section>


  <section class="card">

    <div class="eyebrow">
      This Week
    </div>

    <div class="week-grid" id="week"></div>

  </section>


  <section class="card">

    <div class="eyebrow">
      Your Lawn
    </div>

    <div class="last-mowed" id="lastMowed">
      Last mowed 8 days ago
    </div>

    <div class="lawn-meter">

      <div class="blade active"></div>
      <div class="blade active"></div>
      <div class="blade active"></div>
      <div class="blade active"></div>
      <div class="blade"></div>

    </div>

    <div class="lawn-status" id="lawnStatus">
      Getting long
    </div>

    <button class="mow-button" id="mowButton">
      I Mowed
    </button>

    <button class="undo" id="undoButton">
      Undo
    </button>

  </section>

</main>


<script>

/* ========================================
   TEMPORARY FORECAST DATA

   Dates/day names are generated automatically
   from the user's current local date.
======================================== */

const forecastData = [
  {
    score: 6.4,
    window: "Best conditions 5–7:30 PM"
  },
  {
    score: 9.4,
    window: "Best conditions 4:45–7:20 PM"
  },
  {
    score: 8.8,
    window: "Best conditions 10 AM–1 PM"
  },
  {
    score: 7.1,
    window: "Best conditions 2–5 PM"
  },
  {
    score: 5.6,
    window: "Best conditions 11 AM–1 PM"
  }
];


/* ========================================
   DATE HELPERS
======================================== */

function getForecastDate(index) {

  const date = new Date();

  date.setHours(12, 0, 0, 0);

  date.setDate(
    date.getDate() + index
  );

  return date;
}


function getShortDay(index) {

  return getForecastDate(index)
    .toLocaleDateString(undefined, {
      weekday: "short"
    })
    .toUpperCase();
}


function getLongDay(index) {

  const weekday =
    getForecastDate(index)
      .toLocaleDateString(undefined, {
        weekday: "long"
      });

  if (index === 0) {

    return `Today · ${weekday}`;

  }

  if (index === 1) {

    return `Tomorrow · ${weekday}`;

  }

  return weekday;
}


/* ========================================
   SCORE COLORS

   Continuous:
   red → orange → yellow → green
======================================== */

function scoreColor(score) {

  const normalized =
    Math.max(0, Math.min(10, score)) / 10;

  const hue =
    normalized * 120;

  return `hsl(${hue}, 66%, 40%)`;
}


function scoreBackground(score) {

  const normalized =
    Math.max(0, Math.min(10, score)) / 10;

  const hue =
    normalized * 120;

  return `hsl(${hue}, 58%, 78%)`;
}


/* ========================================
   WEEKLY FORECAST
======================================== */

const week =
  document.getElementById("week");

const mainScore =
  document.getElementById("mainScore");

const heroDay =
  document.getElementById("heroDay");

const bestWindow =
  document.getElementById("bestWindow");


forecastData.forEach((item, index) => {

  const button =
    document.createElement("button");

  button.className =
    "day" +
    (index === 0 ? " selected" : "");

  button.innerHTML = `

    <div class="day-name">
      ${getShortDay(index)}
    </div>

    <div
      class="day-score"
      style="
        background:
        ${scoreBackground(item.score)}
      "
    >
      ${item.score.toFixed(1)}
    </div>

  `;

  button.addEventListener(
    "click",
    () => selectDay(index, button)
  );

  week.appendChild(button);

});


function selectDay(index, button) {

  document
    .querySelectorAll(".day")
    .forEach(day => {

      day.classList.remove("selected");

    });

  button.classList.add("selected");

  showDay(index);
}


function showDay(index) {

  const item =
    forecastData[index];

  heroDay.textContent =
    getLongDay(index);

  bestWindow.textContent =
    item.window;

  mainScore.style.transform =
    "scale(.92)";

  setTimeout(() => {

    mainScore.textContent =
      item.score.toFixed(1);

    mainScore.style.color =
      scoreColor(item.score);

    mainScore.style.transform =
      "scale(1)";

  }, 100);
}


/* ========================================
   LAWN TRACKER
======================================== */

const STORAGE_KEY =
  "mow-last-mowed";

const INITIAL_FAKE_DAYS_SINCE_MOW =
  8;

let previousMowDate = null;

let undoTimer = null;


const lastMowed =
  document.getElementById("lastMowed");

const lawnStatus =
  document.getElementById("lawnStatus");

const mowButton =
  document.getElementById("mowButton");

const undoButton =
  document.getElementById("undoButton");


function setMeter(level) {

  document
    .querySelectorAll(".blade")
    .forEach((blade, index) => {

      blade.classList.toggle(
        "active",
        index < level
      );

    });

}


/* ========================================
   CHECK WHETHER DATE IS TODAY
======================================== */

function isToday(date) {

  const now =
    new Date();

  return (
    date.getFullYear() ===
      now.getFullYear() &&

    date.getMonth() ===
      now.getMonth() &&

    date.getDate() ===
      now.getDate()
  );
}


/* ========================================
   UPDATE LAWN DISPLAY
======================================== */

function updateLawn() {

  const saved =
    localStorage.getItem(STORAGE_KEY);

  /*
    Prototype default:
    if there's no mowing history yet,
    pretend it was 8 days ago.
  */

  if (!saved) {

    lastMowed.textContent =
      `Last mowed ${INITIAL_FAKE_DAYS_SINCE_MOW} days ago`;

    setMeter(4);

    lawnStatus.textContent =
      "Getting long";

    mowButton.disabled = false;

    mowButton.textContent =
      "I Mowed";

    return;
  }


  const mowDate =
    new Date(saved);


  /*
    If user already logged a mow today,
    the button stays disabled.
  */

  if (isToday(mowDate)) {

    lastMowed.textContent =
      "Mowed today";

    setMeter(1);

    lawnStatus.textContent =
      "Not yet";

    mowButton.textContent =
      "✓ Mowed";

    mowButton.disabled =
      true;

    return;
  }


  const now =
    new Date();


  /*
    Use calendar dates rather than exact
    elapsed hours.

    Example:
    Yesterday at 11 PM still counts as
    "1 day ago" after midnight.
  */

  const todayMidnight =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const mowMidnight =
    new Date(
      mowDate.getFullYear(),
      mowDate.getMonth(),
      mowDate.getDate()
    );


  const days =
    Math.round(
      (todayMidnight - mowMidnight) /
      86400000
    );


  lastMowed.textContent =
    `Last mowed ${days} day${days === 1 ? "" : "s"} ago`;


  /*
    Temporary prototype growth logic.

    Later this will be replaced by the
    real Lawn Tracker growth model.
  */

  if (days <= 3) {

    setMeter(1);

    lawnStatus.textContent =
      "Not yet";

  }

  else if (days <= 6) {

    setMeter(2);

    lawnStatus.textContent =
      "Getting there";

  }

  else if (days <= 9) {

    setMeter(4);

    lawnStatus.textContent =
      "Getting long";

  }

  else {

    setMeter(5);

    lawnStatus.textContent =
      "Likely long";

  }


  /*
    New day = user can log another mow.
  */

  mowButton.disabled =
    false;

  mowButton.textContent =
    "I Mowed";

}


/* ========================================
   I MOWED
======================================== */

mowButton.addEventListener(
  "click",
  () => {

    /*
      Don't allow repeated clicks.
    */

    if (mowButton.disabled) {
      return;
    }


    previousMowDate =
      localStorage.getItem(
        STORAGE_KEY
      );


    localStorage.setItem(
      STORAGE_KEY,
      new Date().toISOString()
    );


    mowButton.disabled =
      true;

    mowButton.textContent =
      "✓ Mowed";


    updateLawn();

    grassConfetti();


    /*
      Undo stays available for 10 seconds.
    */

    undoButton.style.display =
      "block";


    if (undoTimer) {

      clearTimeout(
        undoTimer
      );

    }


    undoTimer =
      setTimeout(() => {

        undoButton.style.display =
          "none";

        previousMowDate =
          null;

      }, 10000);

  }
);


/* ========================================
   UNDO
======================================== */

undoButton.addEventListener(
  "click",
  () => {

    if (undoTimer) {

      clearTimeout(
        undoTimer
      );

      undoTimer = null;
    }


    if (previousMowDate) {

      localStorage.setItem(
        STORAGE_KEY,
        previousMowDate
      );

    }

    else {

      localStorage.removeItem(
        STORAGE_KEY
      );

    }


    previousMowDate =
      null;


    undoButton.style.display =
      "none";


    updateLawn();

  }
);


/* ========================================
   GRASS CONFETTI
======================================== */

function grassConfetti() {

  const rect =
    mowButton.getBoundingClientRect();


  const startX =
    rect.left +
    rect.width / 2;


  const startY =
    rect.top +
    rect.height / 2;


  for (
    let i = 0;
    i < 40;
    i++
  ) {

    const grass =
      document.createElement(
        "div"
      );


    grass.className =
      "confetti";


    grass.style.left =
      `${startX}px`;


    grass.style.top =
      `${startY}px`;


    grass.style.setProperty(
      "--x",
      `${(Math.random() - .5) * 330}px`
    );


    grass.style.setProperty(
      "--y",
      `${-80 - Math.random() * 240}px`
    );


    grass.style.setProperty(
      "--r",
      `${Math.random() * 600 - 300}deg`
    );


    document.body.appendChild(
      grass
    );


    setTimeout(
      () => grass.remove(),
      1000
    );

  }

}


/* ========================================
   MIDNIGHT CHECK

   If the app stays open overnight,
   refresh the date labels and lawn state.
======================================== */

let currentDateKey =
  new Date().toDateString();


setInterval(() => {

  const newDateKey =
    new Date().toDateString();


  if (
    newDateKey !==
    currentDateKey
  ) {

    location.reload();

  }

}, 60000);


/* ========================================
   INITIAL STATE
======================================== */

showDay(0);

updateLawn();

</script>

</body>
</html>
